name: Crypto TimesFM-3 Predictor

on:
  schedule:
    - cron: '30 13,17 * * *'
  workflow_dispatch:

jobs:
  predict_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Extracción y Modelo TimesFM-3
        run: python predict.py

      - name: Actualizar panel en GitHub
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add README.md predicciones.csv
          git commit -m "🤖 Actualización automática TimesFM: $(date)" || echo "No hay cambios para commitear"
          git pull --rebase origin main
          git push
